# Nginx Reverse Proxy Yapılandırması
# Dosya yolu: /etc/nginx/sites-available/tensorflow-api

upstream flask_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream media_server {
    server 127.0.0.1:4000;
}

# ============================================================
# CLUSTER MOD (birden fazla SFU node) — roomId tabanl\u0131
# consistent hashing. Native nginx (>=1.7.2) yeterli, Lua/OpenResty
# gerekmez. Ayn\u0131 roomId her zaman ayn\u0131 backend'e d\u00fc\u015fer; bir node
# d\u00fc\u015ferse `consistent` flag\u0131 sadece o node'un odalar\u0131n\u0131 yeniden
# da\u011f\u0131t\u0131r (di\u011fer odalar etkilenmez).
#
# Kullanmak i\u00e7in:
#   1. A\u015fa\u011f\u0131daki `map` ve `upstream` blo\u011fun yorumunu kald\u0131r
#   2. server adreslerini ger\u00e7ek SFU node IP'lerine ayarla
#   3. `location /conference-socket.io/` blo\u011funda `proxy_pass`'i
#      `http://media_server_cluster` olarak de\u011fi\u015ftir
# ------------------------------------------------------------
# Hash key se\u00e7imi:
#   - roomId varsa  \u2192 sadece roomId  (ayn\u0131 oda = ayn\u0131 node, SFU lokal)
#   - roomId yoksa  \u2192 client IP      (eski/handshake-only client'lar
#                                       tek node'a y\u0131\u011f\u0131lmas\u0131n)
# Bu mant\u0131k `map` ile kurulur \u00e7\u00fcnk\u00fc concat (`$arg_roomId$remote_addr`)
# yapan tek-string yakla\u015f\u0131m\u0131 SFU lokalitesini bozar: ayn\u0131 odadaki iki
# farkl\u0131 IP'li client farkl\u0131 node'a d\u00fc\u015fer ve RTP'leri bulu\u015famaz.
# ------------------------------------------------------------
# map $arg_roomId $sfu_hash_key {
#     default   $arg_roomId;   # roomId varsa onu kullan
#     ""        $remote_addr;  # bo\u015fsa IP fallback
# }
#
# upstream media_server_cluster {
#     hash $sfu_hash_key consistent;
#     server 10.0.0.11:4000 max_fails=3 fail_timeout=10s;
#     server 10.0.0.12:4000 max_fails=3 fail_timeout=10s;
#     server 10.0.0.13:4000 max_fails=3 fail_timeout=10s;
#     keepalive 64;
# }
# ============================================================
# ============================================================

server {
    listen 80;
    server_name _;  # Domain adınızı buraya yazın

    # Timeout ayarları - ÖNEMLİ!
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Request body limit (büyük JSON'lar için)
    client_max_body_size 10M;
    client_body_timeout 120s;

    location / {
        proxy_pass http://flask_app;
        proxy_redirect off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffering ayarları
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Socket.io (Media Server)
    # Tek node: media_server (127.0.0.1:4000) kullan\u0131l\u0131r.
    # Cluster: yukar\u0131daki media_server_cluster blo\u011funu a\u00e7\u0131p
    # proxy_pass'i `http://media_server_cluster` yap.
    #
    # Native nginx, query string'den `roomId`'yi `$arg_roomId` olarak
    # okur ve `hash $arg_roomId consistent;` ile ayn\u0131 odan\u0131n t\u00fcm
    # kat\u0131l\u0131mc\u0131lar\u0131n\u0131 ayn\u0131 SFU node'una y\u00f6nlendirir. Client'lar
    # `io('/conference', { query: { roomId } })` ile ba\u011flan\u0131yor (admin
    # & vizyo'da uyguland\u0131), bu y\u00fczden handshake URL'i:
    #   /conference-socket.io/?EIO=4&transport=websocket&roomId=ABC123
    location /conference-socket.io/ {
        proxy_pass http://media_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Room-Id $arg_roomId;
        # WebSocket: idle timeout y\u00fcksek olmal\u0131 (uzun konferanslar).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Legacy /socket.io/ (varsa) — ayn\u0131 backend'e gider.
    location /socket.io/ {
        proxy_pass http://media_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://flask_app/health;
        proxy_read_timeout 10s;
    }
}

