# ============================================================
# CLUSTER MOD (birden fazla SFU node) için map + upstream.
# Şu an tek node (127.0.0.1:4000) kullanılıyor; cluster'a geçince
# aşağıdaki iki bloğun '#' yorumlarını kaldır ve location
# /conference-socket.io/ içindeki proxy_pass'i değiştir.
#
# Hash mantığı:
#   - roomId varsa  → sadece roomId  (aynı oda = aynı node, SFU lokal)
#   - roomId yoksa  → client IP      (eski client'lar tek node'a yığılmasın)
# ------------------------------------------------------------
# map $arg_roomId $sfu_hash_key {
#     default   $arg_roomId;
#     ""        $remote_addr;
# }
#
# upstream media_server_cluster {
#     hash $sfu_hash_key consistent;
#     server 10.0.0.11:4000 max_fails=3 fail_timeout=10s;
#     server 10.0.0.12:4000 max_fails=3 fail_timeout=10s;
#     server 10.0.0.13:4000 max_fails=3 fail_timeout=10s;
#     keepalive 64;
# }
# ============================================================

# Backend API Server
server {
    server_name api.appandcapital.com.tr;

    # Request body limit
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Ana API endpoint
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.io dahil)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SOHBET / GENEL SOCKET.IO → backend 3000
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # VİDEO KONFERANS SOCKET.IO (PORT 4000 - tensorflow_api)
    # Tek node: proxy_pass http://127.0.0.1:4000/socket.io/;
    # Cluster:  proxy_pass http://media_server_cluster/socket.io/;
    #   (yukarıdaki map + upstream blokları aktif olmalı)
    #
    # Client'lar handshake URL'inde ?roomId=... taşır; nginx onu
    # $arg_roomId olarak okur. Cluster modunda 'hash $sfu_hash_key
    # consistent;' aynı odanın tüm katılımcılarını aynı SFU node'una
    # yönlendirir (mediasoup transport/producer state node-local).
    location /conference-socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;

        proxy_http_version 1.1;

        # WebSocket Başlıkları
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standart Proxy Başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Room-Id $arg_roomId;   # debug/log için
        proxy_cache_bypass $http_upgrade;

        # KRITIK: Uzun süreli WebSocket bağlantıları için
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;    # 1 saat
        proxy_read_timeout 3600s;    # 1 saat

        # Buffer ayarları
        proxy_buffering off;
        proxy_cache off;
    }

    # HLS Canlı Yayın segmentleri (tensorflow_api port 4000)
    # Cluster modunda: roomId hangi node'da yayında ise HLS de orada.
    # Şu an map kapalı, /live/ → tek node. Cluster'a geçince:
    #   proxy_pass http://media_server_cluster;
    # ve location'ın query string'inde roomId taşınması gerekir
    # (LIVE_HLS_BASE_URL .../live/?roomId=<id> şeklinde olmalı) — ya da
    # cascade/HLS replikasyonu (Adım 3) çözer.
    location /live/ {
        proxy_pass http://127.0.0.1:4000/live/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Manifest: cache YOK (her istekte taze)
        location ~ \.m3u8$ {
            proxy_pass http://127.0.0.1:4000;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
            expires -1;
        }

        # Segmentler: kısa cache (segment dosyaları silindiği için uzun olmamalı)
        location ~ \.ts$ {
            proxy_pass http://127.0.0.1:4000;
            add_header Cache-Control "public, max-age=10" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # fMP4 segment + init parcasi (-hls_segment_type fmp4 kullanan canli
        # pipeline .m4s/init.mp4 uretiyor, .ts degil). Dosya adlari asla
        # yeniden yazilmaz (seg_%05d.m4s), silinene kadar icerik sabit -
        # SpacesHlsUploader.js'deki CDN yolundaki gibi agresif cache guvenli.
        location ~ \.(m4s|mp4)$ {
            proxy_pass http://127.0.0.1:4000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    # (Opsiyonel) Yayıncı tarafının kullandığı media-server REST endpoint'leri
    # Cluster'a geçince: proxy_pass http://media_server_cluster/live-broadcast/;
    location /live-broadcast/ {
        proxy_pass http://127.0.0.1:4000/live-broadcast/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Room-Id $arg_roomId;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # AI konferans katilimcisi REST endpoint'leri (join/leave/status). Bunlar
    # /conference-socket.io/ (WebSocket sinyalizasyon, yukarida) ile karistirilmasin -
    # ayri bir path prefix, ayni upstream (4000, ConferenceSocket.js'in yasadigi
    # Node processi). Bu blok olmadan istekler catch-all'a dusup 502 donuyordu.
    location /conference/ {
        proxy_pass http://127.0.0.1:4000/conference/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /hls/ {
        proxy_pass http://127.0.0.1:4000/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /audio/ {
        proxy_pass http://127.0.0.1:4000/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ====== AI / Vision service (tensorflow_api container :8000) ======
    # Mobile client resimli istekleri Node proxy'yi (App Platform) bypass edip
    # buraya direkt geliyor. imageUrls field'i Python /chat tarafindan validate
    # edilip multimodal payload'a cevriliyor. Bkz: src/api/actions.ts sendChat.
    location /chat {
        proxy_pass http://127.0.0.1:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # AI Psikolog (terapi_ai mobile) - /chat'ten ayri, kendi promptuyla calisan endpoint
    location /psychology/ {
        proxy_pass http://127.0.0.1:8000/psychology/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Whisper STT proxy (multipart audio upload)
    location /transcribe {
        proxy_pass http://127.0.0.1:8000/transcribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # TTS proxy
    location /speak {
        proxy_pass http://127.0.0.1:8000/speak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Media transcode worker health
    # Exact-match olmasi onemli: aksi halde asagidaki `/health` location'i
    # `/health/worker` istegini de 8000 Flask servisine yonlendirip 404 uretebilir.
    location = /health/worker {
        proxy_pass http://127.0.0.1:4000/health/worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    # AI service health (Node /v1/health'ten ayri — bu 8000'e gider)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Flask summary endpoints (market-cards, conference-prompt vs.)
    location /summary/ {
        proxy_pass http://127.0.0.1:8000/summary/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # =================================================================

    # Health check endpoint
    location /v1/health {
        proxy_pass http://127.0.0.1:3000/v1/health;
        proxy_read_timeout 10s;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.appandcapital.com.tr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.appandcapital.com.tr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.appandcapital.com.tr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.appandcapital.com.tr;
    return 404; # managed by Certbot
}
